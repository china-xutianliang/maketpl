<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>透明模板制作 · maketpl 推广视频</title>
<!--
  HTML 推广视频（与 video/out/voice.mp3 口播 + timing.json 对齐，约 58 秒）
  打开即播：promo.html        竖屏：promo.html?v        录屏模式（隐藏按钮）：promo.html?rec
  逐帧导出：export.mjs 调 window.renderAt(t) 截图后用 ffmpeg 合成
-->
<style>
  :root{
    --bg:#f4f4f2; --card:#fff; --border:#e7e7e4; --ink:#2f2f2d; --sub:#8b8b88;
    --accent:#3f6f52; --accent-soft:#e9f1eb; --red:#e5484d; --dark:#2e2e2c; --purple:#7b5cf0;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;background:#151514;overflow:hidden;
    font-family:"Microsoft YaHei","PingFang SC","Noto Sans SC","WenQuanYi Zen Hei",system-ui,sans-serif}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  #stage{width:1920px;height:1080px;background:var(--bg);position:relative;overflow:hidden;
    color:var(--ink);transform-origin:center;flex:none}
  body.v #stage{width:1080px;height:1920px}

  /* 背景点阵 */
  #stage::before{content:"";position:absolute;inset:0;
    background-image:radial-gradient(#dcdcd7 1.2px,transparent 1.2px);background-size:28px 28px;opacity:.55}

  .layer{position:absolute;inset:0;opacity:0;will-change:opacity}

  /* 文案面板 */
  #panel{position:absolute;left:96px;top:0;bottom:200px;width:600px;display:flex;flex-direction:column;
    justify-content:center;gap:28px;z-index:5}
  body.v #panel{left:72px;right:72px;width:auto;top:110px;bottom:auto;height:360px;justify-content:flex-start}
  #brand{display:flex;align-items:center;gap:16px;font-size:26px;color:var(--sub);font-weight:600}
  #brand img{width:52px;height:52px;border-radius:12px}
  #kicker{align-self:flex-start;font-size:28px;font-weight:700;color:var(--accent);background:var(--accent-soft);
    padding:10px 26px;border-radius:999px}
  #headline{font-size:72px;line-height:1.22;font-weight:800;letter-spacing:-1px}
  body.v #headline{font-size:70px}
  #headline em{font-style:normal;color:var(--accent)}
  #headline .r{color:var(--red)}
  #desc{font-size:32px;line-height:1.55;color:var(--sub)}
  body.v #desc{font-size:34px}
  .txt{transition:none}

  /* 演示区（右侧 / 竖屏下方） */
  #view{position:absolute;left:760px;top:56px;width:1100px;height:800px;border-radius:28px;overflow:hidden;
    background:#fff;box-shadow:0 30px 90px rgba(30,30,25,.16),0 0 0 1px var(--border)}
  body.v #view{left:50px;top:560px;width:980px;height:1060px}

  /* 像素示意画布 */
  #demoWrap{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#fafaf8}
  #demo{width:100%;height:auto;image-rendering:pixelated}
  #badge{position:absolute;right:28px;top:28px;padding:16px 26px;border-radius:18px;font-size:30px;font-weight:800;
    color:#fff;box-shadow:0 10px 30px rgba(0,0,0,.18)}
  #legend{position:absolute;left:28px;bottom:26px;display:flex;gap:16px}
  .lg{display:flex;align-items:center;gap:10px;font-size:26px;font-weight:700;background:#fff;padding:10px 18px;border-radius:14px;
    box-shadow:0 6px 20px rgba(0,0,0,.08)}
  .sw{width:26px;height:26px;border-radius:6px}

  /* 多帧扇形 */
  #fan{position:absolute;inset:0;perspective:1600px;background:#fafaf8}
  #fan canvas{position:absolute;left:50%;top:50%;width:640px;height:360px;margin:-180px 0 0 -320px;border-radius:14px;
    box-shadow:0 18px 50px rgba(0,0,0,.18);image-rendering:pixelated;border:4px solid #fff}
  body.v #fan canvas{width:600px;height:338px;margin:-169px 0 0 -300px}
  #fanCount{position:absolute;right:30px;top:26px;font-size:64px;font-weight:900;color:var(--accent)}
  #fanCount small{font-size:30px;color:var(--sub);font-weight:700;margin-left:6px}

  /* 真实界面镜头 */
  #cam{position:absolute;inset:0;background:#f4f4f2}
  #inner{position:absolute;left:0;top:0;width:1760px;height:1400px;transform-origin:0 0}
  #inner img.ui{position:absolute;left:0;top:0;width:1760px;height:1400px;opacity:0}
  .ov{position:absolute;pointer-events:none}
  #selBox{border:4px solid #e8902a;background:rgba(232,144,42,.08)}
  #hitBox{border:5px solid #3fbf6a;border-radius:4px;box-shadow:0 0 0 4px rgba(63,191,106,.25)}
  #hitTag{background:#3fbf6a;color:#fff;font-weight:800;font-size:22px;padding:4px 10px;border-radius:8px;white-space:nowrap}
  #ghost{width:70px;height:70px;margin:-35px 0 0 -35px}
  #cursor{width:44px;height:44px;z-index:9;filter:drop-shadow(0 4px 6px rgba(0,0,0,.35))}
  .ripple{position:absolute;border-radius:50%;border:5px solid var(--accent);pointer-events:none}
  #callout{position:absolute;padding:14px 22px;border-radius:16px;background:var(--dark);color:#fff;font-size:28px;
    font-weight:700;white-space:nowrap;box-shadow:0 12px 30px rgba(0,0,0,.25);z-index:8}
  #callout::after{content:"";position:absolute;left:28px;bottom:-12px;border:12px solid transparent;border-bottom:0;border-top-color:var(--dark)}

  /* 成品卡 */
  #result{position:absolute;right:24px;bottom:24px;display:flex;gap:16px;align-items:flex-end;z-index:7;background:rgba(255,255,255,.96);padding:18px 18px 46px;border-radius:24px;box-shadow:0 20px 50px rgba(0,0,0,.18)}
  .rc{width:150px;height:170px;border-radius:18px;display:flex;align-items:center;justify-content:center;
    box-shadow:0 12px 34px rgba(0,0,0,.2);position:relative}
  .rc img{width:72px;height:85px;transform:scale(1.5);image-rendering:pixelated}
  .rc span{position:absolute;bottom:-34px;font-size:20px;color:var(--sub);font-weight:700;white-space:nowrap}
  .checker{background-color:#fff;background-image:linear-gradient(45deg,#e4e4e0 25%,transparent 25%),linear-gradient(-45deg,#e4e4e0 25%,transparent 25%),
    linear-gradient(45deg,transparent 75%,#e4e4e0 75%),linear-gradient(-45deg,transparent 75%,#e4e4e0 75%);
    background-size:24px 24px;background-position:0 0,0 12px,12px -12px,-12px 0}

  /* 结尾 CTA */
  #cta{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:34px;z-index:6;background:var(--bg)}
  #cta .logo{width:220px;height:220px;border-radius:48px;box-shadow:0 30px 70px rgba(123,92,240,.35)}
  #cta h1{font-size:110px;font-weight:900;letter-spacing:-2px}
  #cta h1 small{display:block;text-align:center;font-size:38px;color:var(--sub);font-weight:600;letter-spacing:4px;margin-top:8px}
  .chips{display:flex;gap:18px;flex-wrap:wrap;justify-content:center;max-width:1500px}
  body.v .chips{max-width:900px}
  .chip{font-size:32px;font-weight:700;padding:16px 30px;border-radius:999px;background:#fff;box-shadow:0 8px 24px rgba(0,0,0,.07)}
  .chip b{color:var(--accent)}
  .cbtn{font-size:44px;font-weight:800;color:#fff;background:var(--accent);padding:26px 64px;border-radius:999px;
    box-shadow:0 18px 44px rgba(63,111,82,.35)}
  .gh{font-size:30px;color:var(--sub);font-family:Consolas,"Courier New",monospace}

  /* 字幕 */
  #sub{position:absolute;left:50%;bottom:34px;transform:translateX(-50%);width:max-content;max-width:1600px;text-align:center;z-index:20;
    font-size:38px;font-weight:700;color:#fff;background:rgba(30,30,28,.86);padding:14px 30px;border-radius:16px;line-height:1.4}
  body.v #sub{bottom:60px;max-width:960px;font-size:42px}
  #sub:empty{display:none}
  #bar{position:absolute;left:0;bottom:0;height:8px;background:var(--accent);z-index:21}

  #ui{position:fixed;top:12px;right:12px;z-index:99;display:flex;gap:8px;font-size:14px}
  #ui button{padding:7px 14px;border:0;border-radius:8px;background:#333;color:#eee;cursor:pointer}
  #start{position:fixed;inset:0;z-index:98;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.55);
    color:#fff;font-size:28px;cursor:pointer}
  body.rec #ui,body.rec #start{display:none}
</style>
</head>
<body>
<div id="ui">
  <button onclick="restart()">▶ 从头播放</button>
  <button onclick="toggleV()">横 / 竖屏</button>
  <button onclick="toggleSub()">字幕开关</button>
</div>
<div id="start" onclick="restart()">▶ 点击播放（带配音）</div>

<div id="wrap"><div id="stage">

  <div id="panel" class="layer" style="opacity:1">
    <div id="brand"><img src="../../icon.png" alt="">透明模板制作 · maketpl</div>
    <div id="kicker">痛点</div>
    <div id="headline"></div>
    <div id="desc"></div>
  </div>

  <div id="view">
    <!-- A. 像素示意 -->
    <div id="demoWrap" class="layer">
      <canvas id="demo" width="960" height="540"></canvas>
      <div id="badge"></div>
      <div id="legend">
        <div class="lg"><div class="sw" style="background:#1f2d40"></div>不变 → 保留</div>
        <div class="lg"><div class="sw checker"></div>动过 → 透明</div>
      </div>
    </div>
    <!-- B. 多帧扇形 -->
    <div id="fan" class="layer"><div id="fanCount"></div></div>
    <!-- C. 真实界面 -->
    <div id="cam" class="layer">
      <div id="inner">
        <img class="ui" data-k="01" src="../assets/ui/01_launch.png">
        <img class="ui" data-k="02" src="../assets/ui/02_bound_live.png">
        <img class="ui" data-k="03" src="../assets/ui/03_boxed.png">
        <img class="ui" data-k="04" src="../assets/ui/04_dyn_monitoring.png">
        <img class="ui" data-k="06" src="../assets/ui/06_wand_selection.png">
        <img class="ui" data-k="09" src="../assets/ui/09_inverted.png">
        <img class="ui" data-k="10" src="../assets/ui/10_test_match.png">
        <div id="selBox" class="ov"></div>
        <div id="hitBox" class="ov"></div>
        <div id="hitTag" class="ov">✓ 命中 · 分数 0.00</div>
        <svg id="ghost" class="ov" viewBox="0 0 70 70"><circle cx="35" cy="35" r="22" fill="none" stroke="#e5484d" stroke-width="4"/>
          <path d="M35 4v18M35 48v18M4 35h18M48 35h18" stroke="#e5484d" stroke-width="4"/><circle cx="35" cy="35" r="6" fill="#e5484d"/></svg>
        <div id="ripples"></div>
        <svg id="cursor" class="ov" viewBox="0 0 24 24"><path d="M3 2l7.5 19 2.6-7.9L21 10.5z" fill="#111" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/></svg>
      </div>
      <div id="callout"></div>
      <div id="result">
        <div class="rc checker"><img src="../assets/ui/saved_tpl.png"><span>透明 PNG</span></div>
        <div class="rc" style="background:#1f2d40"><img src="../assets/ui/saved_tpl.png"><span>叠深色</span></div>
        <div class="rc" style="background:#8fd3b0"><img src="../assets/ui/saved_tpl.png"><span>叠浅色</span></div>
      </div>
    </div>
  </div>

  <!-- D. 结尾 -->
  <div id="cta" class="layer">
    <img class="logo" src="../../icon.png" alt="">
    <h1>透明模板制作<small>maketpl · 识图模板工具</small></h1>
    <div class="chips">
      <div class="chip"><b>连拍求稳</b> 动的像素自动透明</div>
      <div class="chip"><b>魔术棒</b> 反选透明</div>
      <div class="chip"><b>测试匹配</b> 同款算法</div>
      <div class="chip"><b>exe</b> 双击即用</div>
    </div>
    <div class="cbtn">评论区扣 1，源码发你</div>
    <div class="gh">github.com/china-xutianliang/maketpl</div>
  </div>

  <div id="sub"></div>
  <div id="bar"></div>
</div></div>

<audio id="voice" src="../out/voice.mp3" preload="auto"></audio>

<script>
/* ===================== 时间轴（来自 video/out/timing.json） ===================== */
const LINES = [
  [0.000, 8.184, "玩游戏写脚本，最烦的就是识图模板里混进会动的东西，路过一个玩家，识别直接报废。"],
  [8.434, 6.768, "这个工具的思路很暴力，对着同一块画面连拍几十帧，每个像素单独审判。"],
  [15.452,7.032, "N 帧里颜色不变的留下，跑来跑去的角色、飘来飘去的光效，一律挖成透明。"],
  [22.734,8.760, "用法特别简单，准星一拖绑定窗口，框选要抠的区域，点一下动态截图，它就实时盯着这块画面。"],
  [31.744,6.312, "谁在动谁就被抠掉，右边实时预览抠图效果，满意了再点一次停止。"],
  [38.306,8.544, "生成的是带 alpha 通道的透明 PNG，魔术棒点一下选中颜色，反选透明，一键只留你要的主体。"],
  [47.100,6.048, "最后直接点测试匹配，用和游戏里一模一样的算法，当场看命中率。"],
  [53.398,4.680, "工具已经打包成 exe，评论区扣一，源码发你。"],
];
const TOTAL = 58.6;

const COPY = [
  ["痛点", '路过一个玩家，<br>识图模板就<span class="r">报废</span>', "模板里混进会动的东西：角色、光效、名字……匹配分数直接爆表。"],
  ["原理", '同一块画面，<br><em>连拍几十帧</em>', "不靠手抠，让时间来判断：每个像素单独审判。"],
  ["原理", '不变的留下，<br>动过的<em>挖成透明</em>', "N 帧里颜色一致 → 保留；跑过的角色、飘的光效 → alpha = 0。"],
  ["① 取图", '准星一拖，<br><em>框选 · 动态截图</em>', "直接绑定游戏窗口，被挡住也能取到画面。"],
  ["② 实时求稳", '谁在动，<br>谁就被<em>抠掉</em>', "右侧实时预览抠图效果，满意了再点「停止并生成」。"],
  ["③ 修图", '魔术棒 + 反选，<br><em>只留主体</em>', "带 alpha 通道的透明 PNG，自动裁边，即拿即用。"],
  ["④ 验证", '同款算法，<br><em>当场测匹配</em>', "和游戏脚本里一模一样的 find_all，命中框 + 分数直接画出来。"],
  ["", "", ""],
];

/* ===================== 工具函数 ===================== */
const $ = id => document.getElementById(id);
const clamp = (x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const ease = x => x<.5 ? 4*x*x*x : 1-Math.pow(-2*x+2,3)/2;
const lerp = (a,b,k)=>a+(b-a)*k;
const win = (t,a,b,f=.4)=>clamp((t-a)/f)*clamp((b-t)/f); // 淡入淡出窗口
function track(t, keys){                    // keys: [[t, ...vals]]
  if (t<=keys[0][0]) return keys[0].slice(1);
  for (let i=1;i<keys.length;i++){
    if (t<=keys[i][0]){
      const k=ease((t-keys[i-1][0])/(keys[i][0]-keys[i-1][0]));
      return keys[i].slice(1).map((v,j)=>lerp(keys[i-1][j+1],v,k));
    }
  }
  return keys[keys.length-1].slice(1);
}
const lineAt = t => { let i=0; LINES.forEach((l,k)=>{ if(t>=l[0]-0.15) i=k; }); return i; };

/* ===================== A. 像素示意场景 ===================== */
const GW=48, GH=27, CELL=20;
const TILE_COLORS=["#dc3c3c","#3a8a4a","#3c64dc","#dcdc3c","#c83cc8","#3cc8c8","#e08c2c","#8c3cdc","#64c832","#c86464","#6464c8","#64c864"];
const base = []; // 基础画面（不含移动物）
for (let y=0;y<GH;y++){ base[y]=[]; for (let x=0;x<GW;x++) base[y][x]="#1f2d40"; }
for (let r=0;r<3;r++) for (let c=0;c<4;c++){
  const x0=6+c*10, y0=3+r*8;
  for (let y=y0;y<y0+6;y++) for (let x=x0;x<x0+7;x++) base[y][x]=TILE_COLORS[r*4+c];
}
for (let x=12;x<36;x++) base[25][x]="#9be29b";       // 底部文字条（静态文字）
// 移动物：小人 + 光效
const HERO=["..yy..","..yy..",".pppp.","pppppp",".pppp.",".b..b.",".b..b."];
const HCOL={y:"#ffd27a",p:"#ff5fa2",b:"#ffffff"};
function movers(k){                       // 第 k 帧（0..29）里会动的像素
  const out=[];
  const hx=Math.round(-4+k*1.85), hy=10+(k%2);
  HERO.forEach((row,j)=>[...row].forEach((ch,i)=>{ if(ch!==".") out.push([hx+i,hy+j,HCOL[ch]]); }));
  const sx=Math.round(30+9*Math.cos(k*.45)), sy=Math.round(6+4*Math.sin(k*.6));   // 飘动光效
  [[0,0],[1,0],[-1,0],[0,1],[0,-1]].forEach(([dx,dy])=>out.push([sx+dx,sy+dy,"#fff7b0"]));
  return out.filter(([x,y])=>x>=0&&y>=0&&x<GW&&y<GH);
}
function drawGrid(ctx, k, maskUpTo=-1, showMovers=true, cell=CELL){
  const masked=new Set();
  for (let j=0;j<=maskUpTo;j++) movers(j).forEach(([x,y])=>masked.add(x+","+y));
  for (let y=0;y<GH;y++) for (let x=0;x<GW;x++){
    if (masked.has(x+","+y)){
      ctx.fillStyle="#ffffff"; ctx.fillRect(x*cell,y*cell,cell,cell);
      ctx.fillStyle="#dedede"; const h=cell/2;
      ctx.fillRect(x*cell,y*cell,h,h); ctx.fillRect(x*cell+h,y*cell+h,h,h);
    } else { ctx.fillStyle=base[y][x]; ctx.fillRect(x*cell,y*cell,cell,cell); }
  }
  if (showMovers) movers(k).forEach(([x,y,c])=>{ ctx.fillStyle=c; ctx.fillRect(x*cell,y*cell,cell,cell); });
  return masked;
}
const demo=$("demo"), dctx=demo.getContext("2d");
// 模板区域（左上 2x2 色块）
const TPL={x:5,y:2,w:20,h:15};
function drawHook(t){
  const k = (t/8.2)*29;                      // 连续移动
  drawGrid(dctx, k, -1, true);
  const overlap = movers(k).some(([x,y])=>x>=TPL.x&&x<TPL.x+TPL.w&&y>=TPL.y&&y<TPL.y+TPL.h);
  dctx.setLineDash([14,10]); dctx.lineWidth=6;
  dctx.strokeStyle = overlap ? "#e5484d" : "#5fd38a";
  dctx.strokeRect(TPL.x*CELL,TPL.y*CELL,TPL.w*CELL,TPL.h*CELL); dctx.setLineDash([]);
  const b=$("badge");
  if (overlap){ b.style.background="#e5484d"; b.textContent="✗ 识别失败 · 分数 63.4"; }
  else { b.style.background="#3f8f5f"; b.textContent="✓ 命中 · 分数 2.1"; }
  $("legend").style.opacity=0;
}
function drawJudge(t){
  const p=clamp((t-15.9)/5.2);
  const kk=Math.floor(p*29);
  drawGrid(dctx, kk, kk, p<1);
  const b=$("badge"); b.style.background="#3f6f52";
  b.textContent = p<1 ? `逐像素比对 · 第 ${kk+1}/30 帧` : "✓ 生成透明模板";
  $("legend").style.opacity=clamp((t-16.4)/.5);
}

/* ===================== B. 多帧扇形 ===================== */
const FAN_N=8, fan=$("fan"), fanCv=[];
for (let i=0;i<FAN_N;i++){
  const c=document.createElement("canvas"); c.width=GW*8; c.height=GH*8;
  drawGrid(c.getContext("2d"), i*4, -1, true, 8);
  fan.appendChild(c); fanCv.push(c);
}
function drawFan(t){
  const p=ease(clamp((t-8.7)/2.6));
  fanCv.forEach((c,i)=>{
    const show=clamp((t-8.7-i*.28)/.3);
    const off=i-(FAN_N-1)/2;
    c.style.opacity=show;
    c.style.transform=`translate(${off*46*p}px, ${off*-30*p}px) rotateY(${-28*p}deg) rotateX(${8*p}deg) translateZ(${-off*30*p}px)`;
    c.style.zIndex=i;
  });
  const n=Math.min(30, Math.floor(clamp((t-8.7)/4.5)*30));
  $("fanCount").innerHTML=`×${n}<small>帧</small>`;
}

/* ===================== C. 真实界面镜头 ===================== */
// 坐标均为截图原始像素（1760×1400）
const SHOTS=[[0,"01"],[25.55,"02"],[28.45,"03"],[30.05,"04"],[37.25,"06"],[43.45,"09"],[48.35,"10"]];
const CAM=[ // t, 焦点x, 焦点y, 缩放(相对适配)
  [22.6, 880,700,1.0],[23.2, 600,500,1.25],[25.6,600,560,1.25],
  [26.2, 440,700,1.45],[28.4,440,700,1.45],[29.4,600,1000,1.2],[30.2,600,900,1.15],
  [32.0, 1300,400,1.75],[35.4,1300,400,1.75],[36.2,700,1050,1.25],[37.4,1200,560,1.35],
  [39.4, 1250,380,1.9],[41.2,1250,380,1.9],[42.4,1150,800,1.35],[43.6,1200,450,1.6],[46.4,1200,450,1.6],
  [47.3, 1000,900,1.1],[48.4,1000,900,1.1],[49.2,290,680,2.6],[52.4,290,680,2.6],[53.2,880,700,1.0]
];
const CUR=[ // t, x, y
  [22.6, 1000,700],[23.4,106,293],[23.9,106,293],[25.3,450,700],[25.9,520,760],
  [26.3,150,585],[26.6,150,585],[28.2,440,793],[29.0,440,793],[29.7,451,1254],[31.0,451,1254],
  [32.2,1500,560],[35.4,1500,560],[36.4,451,1254],[37.2,451,1254],
  [39.0,1300,330],[39.8,1123,262],[41.6,1123,262],[42.6,1014,1008],[43.6,1014,1008],[44.6,1600,620],
  [47.4,1300,1150],[48.0,1124,1252],[48.7,1124,1252],[49.4,420,820],[53,420,820]
];
const CLICKS=[[23.6,106,293],[25.4,450,700],[26.5,150,585],[28.2,440,793],[29.8,451,1254],[36.8,451,1254],[40.2,1123,262],[43.3,1014,1008],[48.2,1124,1252]];
const CALLOUTS=[ // t0,t1, 截图x,y, 文字
  [23.6,25.4, 106,293,"按住准星，拖到游戏窗口"],
  [26.4,28.6, 150,585,"拖动框选要抠的区域"],
  [29.4,31.4, 451,1254,"点「动态截图」开始盯画面"],
  [32.4,35.4, 1100,240,"右侧实时预览：动的像素被挖掉"],
  [36.2,37.3, 451,1254,"满意了 → 停止并生成"],
  [39.8,42.2, 1123,262,"魔术棒点一下 = 选中这块颜色"],
  [42.8,43.9, 1014,1008,"反选透明"],
  [44.0,46.8, 1100,240,"只留主体 · 自动裁成 72×85"],
  [49.2,52.8, 140,580,"命中框 + 分数，当场验证"],
];
const imgs=[...document.querySelectorAll("#inner img.ui")];
let VIEW={w:1100,h:800};
function camAt(t){
  const [fx,fy,z]=track(t,CAM);
  const fit=Math.min(VIEW.w/1760, VIEW.h/1400), s=fit*z;
  // 不让画面拉出边界
  let tx=VIEW.w/2-fx*s, ty=VIEW.h/2-fy*s;
  if (1760*s>=VIEW.w) tx=clamp(tx, VIEW.w-1760*s, 0); else tx=(VIEW.w-1760*s)/2;
  if (1400*s>=VIEW.h) ty=clamp(ty, VIEW.h-1400*s, 0); else ty=(VIEW.h-1400*s)/2;
  return {s,tx,ty};
}
function drawUI(t){
  // 截图切换（0.25s 交叉淡化）
  imgs.forEach(im=>{
    const k=im.dataset.k; let o=0;
    SHOTS.forEach(([t0,kk],i)=>{
      const t1=i+1<SHOTS.length?SHOTS[i+1][0]:99;
      if (kk===k) o=Math.max(o, clamp((t-t0)/.25)*clamp((t1+.25-t)/.25));
    });
    if (k==="01" && t<SHOTS[1][0]) o=1;
    im.style.opacity=o;
  });
  const {s,tx,ty}=camAt(t);
  $("inner").style.transform=`translate(${tx}px,${ty}px) scale(${s})`;

  // 光标
  const [cx,cy]=track(t,CUR), cur=$("cursor");
  const cs=44/s; cur.style.width=cs+"px"; cur.style.height=cs+"px";
  cur.style.left=(cx-cs*.12)+"px"; cur.style.top=(cy-cs*.06)+"px";
  cur.style.opacity = t<53 ? 1 : 0;

  // 拖动中的准星
  const g=$("ghost"), dragging=t>23.6&&t<25.5;
  g.style.opacity=dragging?1:0; g.style.left=cx+"px"; g.style.top=cy+"px";
  g.style.width=g.style.height=(70/s)+"px"; g.style.margin=(-35/s)+"px 0 0 "+(-35/s)+"px";

  // 框选矩形（在 02 上拖出，之后 03 截图自带）
  const sb=$("selBox");
  if (t>26.5 && t<28.5){
    const p=ease(clamp((t-26.6)/1.6));
    sb.style.opacity=1; sb.style.left="150px"; sb.style.top="585px";
    sb.style.width=(290*p)+"px"; sb.style.height=(208*p)+"px"; sb.style.borderWidth=(3/s*1.3)+"px";
  } else sb.style.opacity=0;

  // 测试匹配命中框
  const hb=$("hitBox"), ht=$("hitTag"), hp=clamp((t-48.6)/.35);
  hb.style.opacity=ht.style.opacity=hp;
  hb.style.left="136px"; hb.style.top="579px"; hb.style.width="58px"; hb.style.height="58px";
  hb.style.borderWidth=(4/s)+"px";
  ht.style.left="136px"; ht.style.top=(579+64)+"px"; ht.style.fontSize=(24/s)+"px"; ht.style.padding=(4/s)+"px "+(10/s)+"px";
  ht.style.borderRadius=(8/s)+"px";

  // 点击涟漪
  const rp=$("ripples"); rp.innerHTML="";
  CLICKS.forEach(([t0,x,y])=>{
    const p=(t-t0)/.55; if (p<0||p>1) return;
    const r=(14+60*p)/s, d=document.createElement("div"); d.className="ripple";
    d.style.left=(x-r)+"px"; d.style.top=(y-r)+"px"; d.style.width=d.style.height=2*r+"px";
    d.style.opacity=1-p; d.style.borderWidth=(5/s)+"px"; rp.appendChild(d);
  });

  // 气泡说明（屏幕坐标）
  const co=$("callout"); let shown=false;
  CALLOUTS.forEach(([a,b,x,y,txt])=>{
    if (t>=a && t<=b){
      shown=true; co.textContent=txt; co.style.opacity=win(t,a,b,.25);
      let sx=x*s+tx-20, sy=y*s+ty-90;
      sx=clamp(sx,16,VIEW.w-co.offsetWidth-16); sy=clamp(sy,16,VIEW.h-80);
      co.style.left=sx+"px"; co.style.top=sy+"px";
    }
  });
  if (!shown) co.style.opacity=0;

  // 成品展示
  const r=$("result"), rk=clamp((t-44.2)/.5)*clamp((47.2-t)/.4);
  r.style.opacity=rk; r.style.transform=`translateY(${(1-rk)*40}px)`;
}

/* ===================== 总渲染 ===================== */
let SUBS=true;
function renderAt(t){
  t=clamp(t,0,TOTAL);
  const li=lineAt(t);
  // 场景可见性
  $("demoWrap").style.opacity = Math.max(win(t,-1,8.35,.35), win(t,15.3,22.7,.35));
  $("fan").style.opacity      = win(t,8.2,15.5,.35);
  $("cam").style.opacity      = win(t,22.5,53.3,.35);
  $("cta").style.opacity      = clamp((t-53.15)/.45);
  $("view").style.opacity     = t<53.6?1:0;
  $("panel").style.opacity    = t<53.6?1:0;

  if (t<8.4) drawHook(t);
  else if (t>=15.2 && t<22.8) drawJudge(t);
  if (t>=8 && t<15.6) drawFan(t);
  if (t>=22.4 && t<53.4) drawUI(t);

  // 文案
  const [kick,head,desc]=COPY[li];
  if ($("headline").dataset.li!=String(li)){
    $("headline").dataset.li=li; $("kicker").textContent=kick; $("headline").innerHTML=head; $("desc").textContent=desc;
  }
  const since=t-LINES[li][0]+.15, a=clamp(since/.45);
  ["kicker","headline","desc"].forEach((id,i)=>{
    const aa=clamp((since-i*.1)/.45);
    $(id).style.opacity=aa; $(id).style.transform=`translateY(${(1-ease(aa))*24}px)`;
  });

  // CTA 进场
  const ck=clamp((t-53.4)/.6);
  [...$("cta").children].forEach((el,i)=>{
    const k=ease(clamp((t-53.4-i*.15)/.5)); el.style.opacity=k; el.style.transform=`translateY(${(1-k)*30}px)`;
  });

  // 字幕
  const L=LINES[li];
  $("sub").textContent = SUBS && t>=L[0] && t<=L[0]+L[1]+.2 ? L[2] : "";
  $("bar").style.width=(t/TOTAL*100)+"%";
}
window.renderAt=renderAt;

/* ===================== 播放 / 布局 ===================== */
const stage=$("stage"), audio=$("voice");
function layout(){
  VIEW={w:$("view").offsetWidth,h:$("view").offsetHeight};
  const sc=Math.min(innerWidth/stage.offsetWidth, innerHeight/stage.offsetHeight);
  stage.style.transform = document.body.classList.contains("export") ? "none" : `scale(${sc})`;
}
let t0=null, playing=false;
function restart(){
  $("start").style.display="none"; playing=true;
  audio.currentTime=0; t0=performance.now();
  audio.play().catch(()=>{});
}
function clock(){
  if (!playing) return 0;
  if (!audio.paused && !audio.ended && audio.currentTime>0) return audio.currentTime;
  return (performance.now()-t0)/1000;
}
function loop(){
  if (!document.body.classList.contains("export")){
    let t=clock();
    if (t>TOTAL+1.5){ restart(); t=0; }
    renderAt(t);
  }
  requestAnimationFrame(loop);
}
function toggleV(){ document.body.classList.toggle("v"); layout(); }
function toggleSub(){ SUBS=!SUBS; }

const q=new URLSearchParams(location.search);
if (q.has("v")) document.body.classList.add("v");
if (q.has("rec")) document.body.classList.add("rec");
if (q.has("export")) document.body.classList.add("export","rec");
if (q.has("nosub")) SUBS=false;
addEventListener("resize",layout); layout(); renderAt(0);
if (q.has("rec") && !q.has("export")) restart();
requestAnimationFrame(loop);
</script>
</body>
</html>
